name: Release

# Two ways to cut a release:
#  - Run this workflow by hand. With "auto", the next version comes from the Conventional Commits
#    since the last tag: feat → minor, fix/perf → patch, "!" or BREAKING CHANGE → major.
#  - Push a tag like v1.4.2 yourself; that exact version is built and released.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, to work out the version and notes

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          $previous = git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>$null
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $previous = git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>$null
            $base = if ($previous) { $previous.TrimStart('v') } else { '0.0.0' }
            $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
            [int]$major, [int]$minor, [int]$patch = $base.Split('.')

            $bump = $env:BUMP
            if ($bump -eq 'auto') {
              $subjects = @(git log $range --format=%s)
              $bodies = (git log $range --format=%b) -join "`n"
              if ($subjects -match '^\w+(\([^)]*\))?!:' -or $bodies -match '(?m)^BREAKING[ -]CHANGE:') { $bump = 'major' }
              elseif ($subjects -match '^feat(\([^)]*\))?:') { $bump = 'minor' }
              elseif ($subjects -match '^(fix|perf)(\([^)]*\))?:') { $bump = 'patch' }
              else { throw "No feat/fix/perf commits since $(if ($previous) { $previous } else { 'the start' }). Pick a bump by hand to release anyway." }
            }
            switch ($bump) {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              'patch' { $patch++ }
            }
            $version = "$major.$minor.$patch"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Not a semver version: $version" }
          if ($env:GITHUB_REF_TYPE -ne 'tag' -and (git tag --list "v$version")) { throw "v$version already exists" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous=$previous" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$version (previous: $(if ($previous) { $previous } else { 'none' }))"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Subtune.exe
        shell: pwsh
        run: |
          dotnet publish src/Subtune -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
            -p:Version=${{ steps.version.outputs.version }} -o publish
          $hash = (Get-FileHash publish/Subtune.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Subtune.exe" | Set-Content publish/Subtune.exe.sha256 -NoNewline

      - name: Write release notes
        shell: pwsh
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          $range = if ($env:PREVIOUS) { "$env:PREVIOUS..HEAD" } else { 'HEAD' }
          $commits = @(git log $range --format=%s)
          $groups = [ordered]@{ 'Features' = '^feat'; 'Fixes' = '^(fix|perf)'; 'Other changes' = '^(refactor|docs|ci|build|chore|style|test)' }
          $notes = foreach ($title in $groups.Keys) {
            $items = $commits | Where-Object { $_ -match "$($groups[$title])(\([^)]*\))?!?:" }
            if ($items) {
              "### $title"
              foreach ($item in $items) {
                $null = $item -match '^\w+(?:\(([^)]*)\))?!?:\s*(.*)$'
                if ($Matches[1]) { "- **$($Matches[1]):** $($Matches[2])" } else { "- $($Matches[2])" }
              }
              ''
            }
          }
          $notes += 'Download `Subtune.exe`, put it anywhere and double-click it. No installer and no .NET install needed.'
          $notes -join "`n" | Set-Content release-notes.md

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" publish/Subtune.exe publish/Subtune.exe.sha256 `
            --title "Subtune v$env:VERSION" --notes-file release-notes.md --target $env:GITHUB_SHA
